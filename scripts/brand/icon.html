<!doctype html>
<!--
  Source for the PNG app icons. Matches public/favicon.svg. Rendered at the window size by
  scripts/brand/render.ps1; "#maskable" fills the square edge to edge and keeps the star in the safe zone.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
      }
      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect id="bg" width="32" height="32" rx="7" fill="#0a2fb8" />
      <g id="star">
        <path
          d="M16 5l3 8h8l-6.5 5 2.5 8-7-5-7 5 2.5-8L5 13h8z"
          fill="#ffd54a"
          stroke="#6b3a00"
          stroke-width="1"
        />
      </g>
    </svg>
    <script>
      if (location.hash === '#maskable') {
        document.getElementById('bg').setAttribute('rx', '0');
        document
          .getElementById('star')
          .setAttribute('transform', 'translate(16 16) scale(0.72) translate(-16 -15.5)');
      }
    </script>
  </body>
</html>
