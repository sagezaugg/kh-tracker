# Monthly dependency updates. Minor and patch bumps arrive as one grouped PR per ecosystem;
# major versions get their own PRs so breaking changes can be reviewed one at a time. CI checks each PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only. Remove this once it supports newer
      # versions (check its peerDependencies), so the TypeScript PR can pass lint.
      - dependency-name: typescript
        versions: ['>= 6.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
