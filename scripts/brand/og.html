<!doctype html>
<!-- Source for public/og.png (1200x630 link preview). Regenerate with scripts/brand/render.ps1. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;700;800&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Saira Semi Condensed', sans-serif;
        color: #eef4ff;
        background:
          radial-gradient(ellipse 70% 90% at 85% 10%, rgba(42, 107, 255, 0.45), transparent 60%),
          radial-gradient(ellipse 60% 70% at 0% 100%, rgba(3, 90, 84, 0.55), transparent 60%),
          linear-gradient(180deg, #03082a, #020615);
      }
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(0deg, rgba(120, 190, 255, 0.04) 0 2px, transparent 2px 5px);
      }
      .frame {
        position: absolute;
        inset: 36px;
        border: 3px solid #2a6bff;
        border-radius: 28px;
        box-shadow:
          0 0 40px rgba(60, 140, 255, 0.45),
          inset 0 0 40px rgba(30, 90, 255, 0.25);
      }
      .content {
        position: absolute;
        left: 96px;
        right: 96px;
        top: 92px;
      }
      .tag {
        display: inline-block;
        padding: 6px 22px;
        border: 2px solid #8fd0ff;
        border-radius: 999px;
        color: #8fd0ff;
        font-size: 28px;
        font-weight: 700;
        font-style: italic;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 28px 0 0;
        font-size: 92px;
        line-height: 1;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0.01em;
        text-shadow: 0 4px 0 #0a1a6a;
      }
      h1 span {
        color: #ffd54a;
      }
      p {
        margin: 26px 0 0;
        max-width: 900px;
        font-size: 34px;
        line-height: 1.3;
        font-weight: 500;
        color: #cfe3ff;
      }
      .games {
        position: absolute;
        left: 96px;
        bottom: 92px;
        display: flex;
        gap: 18px;
      }
      .game {
        padding: 10px 28px;
        border-radius: 999px;
        font-size: 32px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0.06em;
        color: #fff;
      }
      .kh1 {
        background: #0a6f63;
        box-shadow: inset 0 0 0 3px #27bfa7;
      }
      .kh2 {
        background: #0a2fb8;
        box-shadow: inset 0 0 0 3px #4fb0ff;
      }
      .url {
        position: absolute;
        right: 96px;
        bottom: 104px;
        font-size: 30px;
        font-weight: 700;
        color: #8fd0ff;
      }
      .star {
        position: absolute;
        right: 92px;
        top: 84px;
        width: 150px;
        height: 150px;
        filter: drop-shadow(0 0 24px rgba(255, 213, 74, 0.55));
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <svg class="star" viewBox="0 0 32 32" aria-hidden="true">
      <path
        d="M16 3l3.4 9H29l-7.6 5.6 2.9 9.4L16 21.4 7.7 27l2.9-9.4L3 12h9.6z"
        fill="#ffd54a"
        stroke="#6b3a00"
        stroke-width="0.8"
      />
    </svg>
    <div class="content">
      <span class="tag">UNOFFICIAL FAN TOOL</span>
      <h1>Kingdom Hearts <span>100%</span> Tracker</h1>
      <p>Checklists, trophies and what&rsquo;s left, read from your PC save.</p>
    </div>
    <div class="games">
      <span class="game kh1">KH1FM</span>
      <span class="game kh2">KH2FM</span>
    </div>
    <div class="url">kh-tracker.vercel.app</div>
  </body>
</html>
